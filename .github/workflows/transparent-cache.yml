```yaml
name: Cache Metadata Debug - Simplified

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  test-cache-debug:
    name: cache-metadata-analysis
    runs-on: blacksmith-staging  # Using blacksmith for direct MinIO access
    env:
      ACTIONS_STEP_DEBUG: true
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_RUNTIME_TOKEN_VERBOSE: true
      ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: true
      RUNNER_DEBUG: 1
      ACTIONS_CACHE_DEBUG: true
      # Enable Azure SDK debugging
      AZURE_LOG_LEVEL: verbose
      NODE_DEBUG: "http,https,net,stream,azure"

    steps:
      - name: Install debugging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tcpdump curl jq nodejs npm
      
      - name: Create test file
        run: |
          echo "Hello from cache test" > test.txt
          cat test.txt
      
      - name: Start packet capture
        run: |
          mkdir -p debug
          # Start tcpdump to capture full packet data focusing on MinIO port
          sudo tcpdump -i any -s 0 -w debug/cache_traffic.pcap port 9000 &
          echo $! > debug/tcpdump.pid
          sleep 2
          echo "Packet capture started on port 9000"

      - name: Debug environment
        run: |
          echo "=== Cache Environment Variables ==="
          env | grep -i "cache" || echo "No cache environment variables found"
          env | grep -i "action" | grep -v "secret" || echo "No action environment variables found"
          
          echo "=== Network Configuration ==="
          ip addr
          ip route
          
          echo "=== DNS Configuration ==="
          cat /etc/resolv.conf
          nslookup minio.blacksmith.sh || echo "DNS resolution failed"
          
          # Try simple connection test to MinIO
          nc -zv minio.blacksmith.sh 9000 || echo "Connection to MinIO failed"

      - name: Create monitoring script
        run: |
          cat > monitor_network.js << 'EOF'
          const http = require('http');
          const https = require('https');
          const fs = require('fs');
          
          // Create a hook to capture all outgoing HTTP requests
          const originalHttpRequest = http.request;
          const originalHttpsRequest = https.request;
          
          const logFile = fs.createWriteStream('http_traffic.log', { flags: 'a' });
          
          function logRequest(protocol, options, requestBody) {
            const timestamp = new Date().toISOString();
            
            // Try to identify the URL
            let url = '';
            if (typeof options === 'string') {
              url = options;
            } else if (options.href) {
              url = options.href;
            } else if (options.hostname || options.host) {
              const host = options.hostname || options.host;
              const port = options.port ? `:${options.port}` : '';
              const path = options.path || '/';
              url = `${protocol}://${host}${port}${path}`;
            }
            
            // Log the request
            logFile.write(`\n[${timestamp}] REQUEST ${options.method || 'GET'} ${url}\n`);
            
            // Log headers if available
            if (options.headers) {
              logFile.write(`Headers: ${JSON.stringify(options.headers, null, 2)}\n`);
            }
            
            // Log body if available
            if (requestBody) {
              logFile.write(`Body: ${requestBody}\n`);
            }
            
            logFile.write(`--------------------------\n`);
          }
          
          function logResponse(res, responseBody) {
            const timestamp = new Date().toISOString();
            
            // Log the response
            logFile.write(`\n[${timestamp}] RESPONSE ${res.statusCode} ${res.statusMessage}\n`);
            
            // Log headers
            logFile.write(`Headers: ${JSON.stringify(res.headers, null, 2)}\n`);
            
            // Log body if available
            if (responseBody) {
              logFile.write(`Body: ${responseBody}\n`);
            }
            
            logFile.write(`==========================\n`);
          }
          
          // Monkey patch HTTP
          http.request = function monkeyPatchedHttpRequest(options, callback) {
            let requestBody = '';
            
            // Capture request details
            logRequest('http', options, null);
            
            const req = originalHttpRequest.call(this, options, function(res) {
              let responseBody = '';
              
              res.on('data', function(chunk) {
                responseBody += chunk;
              });
              
              res.on('end', function() {
                logResponse(res, responseBody);
                
                if (callback) {
                  callback(res);
                }
              });
            });
            
            const originalWrite = req.write;
            req.write = function(chunk) {
              requestBody += chunk;
              return originalWrite.apply(this, arguments);
            };
            
            const originalEnd = req.end;
            req.end = function(chunk) {
              if (chunk) {
                requestBody += chunk;
              }
              logRequest('http', options, requestBody);
              return originalEnd.apply(this, arguments);
            };
            
            return req;
          };
          
          // Monkey patch HTTPS
          https.request = function monkeyPatchedHttpsRequest(options, callback) {
            let requestBody = '';
            
            // Capture request details
            logRequest('https', options, null);
            
            const req = originalHttpsRequest.call(this, options, function(res) {
              let responseBody = '';
              
              res.on('data', function(chunk) {
                responseBody += chunk;
              });
              
              res.on('end', function() {
                logResponse(res, responseBody);
                
                if (callback) {
                  callback(res);
                }
              });
            });
            
            const originalWrite = req.write;
            req.write = function(chunk) {
              requestBody += chunk;
              return originalWrite.apply(this, arguments);
            };
            
            const originalEnd = req.end;
            req.end = function(chunk) {
              if (chunk) {
                requestBody += chunk;
              }
              logRequest('https', options, requestBody);
              return originalEnd.apply(this, arguments);
            };
            
            return req;
          };
          
          console.log('HTTP and HTTPS monitoring started. Press Ctrl+C to exit.');
          process.stdin.resume();
          EOF
          
          # Make the script executable
          chmod +x monitor_network.js
      
      - name: Run cache operation with monitoring
        run: |
          # Start the monitoring script in the background
          node monitor_network.js &
          MONITOR_PID=$!
          echo "Network monitor started with PID $MONITOR_PID"
          
          # Export NODE_OPTIONS to load the network monitor
          export NODE_DEBUG="http,https,net,stream,azure"
          export AZURE_LOG_LEVEL="verbose"
          
          # Try to use the cache action
          echo "Running cache action now..."
          actions/cache/save@v4 path=test.txt key=test-cache-debug-${{ github.run_id }} || echo "Cache action failed but continuing"
          
          # Give some time for logs to flush
          sleep 5
          
          # Stop the monitoring script
          kill $MONITOR_PID || true
      
      - name: Try native cache save (with debugging)
        id: cache-normal
        continue-on-error: true
        env:
          NODE_DEBUG: http,https,net,stream,azure
          AZURE_LOG_LEVEL: verbose
        uses: actions/cache/save@v4
        with:
          path: test.txt
          key: test-cache-debug-${{ github.run_id }}-1

      - name: Stop packet capture
        run: |
          if [ -f debug/tcpdump.pid ]; then
            sudo kill $(cat debug/tcpdump.pid) || true
            sleep 2
            echo "Packet capture stopped"
          fi

      - name: Analyze packet capture
        run: |
          if [ -f debug/cache_traffic.pcap ]; then
            echo "Converting packet capture to readable format..."
            sudo tcpdump -r debug/cache_traffic.pcap -A > debug/cache_traffic.txt
            
            echo "Number of packets captured: $(sudo tcpdump -r debug/cache_traffic.pcap | wc -l)"
            
            echo "=== Sample of captured traffic ==="
            head -n 100 debug/cache_traffic.txt
            
            echo "=== Looking for HTTP headers ==="
            sudo tcpdump -r debug/cache_traffic.pcap -A | grep -A 5 -B 5 "HTTP" | head -n 100
            
            echo "=== Looking for storage paths ==="
            sudo tcpdump -r debug/cache_traffic.pcap -A | grep -i "cache\|blob\|storage" | head -n 100
          else
            echo "No packet capture file found"
          fi
      
      - name: Show monitoring logs
        run: |
          if [ -f http_traffic.log ]; then
            echo "=== HTTP Traffic Log ==="
            cat http_traffic.log
          else
            echo "No HTTP traffic log found"
          fi
      
      - name: Check for Azure SDK logs
        run: |
          echo "Looking for Azure SDK logs..."
          find /tmp -name "*.log" -type f | xargs ls -la
          
          echo "=== Azure SDK Log Contents ==="
          find /tmp -name "*azure*.log" -type f | xargs cat || echo "No Azure SDK logs found"
      
      - name: Examine cache implementation
        run: |
          echo "Looking for cache implementation files..."
          find /home/runner -name "*cache*.js" -type f | xargs grep -l "uploadCacheArchive" 2>/dev/null | head -5 | xargs cat 2>/dev/null || echo "No implementation files found"
          
          echo "Looking for error sources..."
          find /home/runner -type f -name "*.js" | xargs grep -l "internal error uploading cache archive" 2>/dev/null | head -5 | xargs cat 2>/dev/null || echo "No error message sources found"

      - name: Setup tmate session for inspection
        if: always()
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
```
