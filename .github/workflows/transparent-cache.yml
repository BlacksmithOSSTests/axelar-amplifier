name: Cache Test with tcpdump

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  test-cache:
    name: test-transparent-cache
    runs-on: blacksmith-staging
    env:
      ACTIONS_STEP_DEBUG: true
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_RUNTIME_TOKEN_VERBOSE: true
      ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: true
      RUNNER_DEBUG: 1
      ACTIONS_CACHE_DEBUG: true

    steps:
      - name: Install tcpdump
        run: |
          sudo apt-get update
          sudo apt-get install -y tcpdump

      - name: Create test file
        run: |
          echo "Hello from cache test" > test.txt
          cat test.txt

      - name: Debug cache environment variables
        run: |
          echo "Checking cache environment variables before save operation..."
          echo "BLACKSMITH_CACHE_URL: $BLACKSMITH_CACHE_URL"
          echo "BLACKSMITH_CACHE_TOKEN: ${BLACKSMITH_CACHE_TOKEN:0:5}..."
          echo "ACTIONS_RUNTIME_TOKEN: ${ACTIONS_RUNTIME_TOKEN:0:5}..."
          echo "Using ACTIONS_CACHE_URL: $ACTIONS_CACHE_URL"
          echo "Using ACTIONS_RESULTS_URL: $ACTIONS_RESULTS_URL"
      
      - name: Setup node for HTTP inspection
        run: |
          node -v
          npm -v
          
          # Create a simple HTTP inspection script
          cat > http-logger.js << 'EOF'
          const http = require('http');
          const https = require('https');
          const fs = require('fs');
          const { spawn } = require('child_process');
          
          // Create log file
          const logFile = fs.createWriteStream('http_requests.log', { flags: 'a' });
          
          // Function to log details
          function logRequest(req, res, body = '') {
            const timestamp = new Date().toISOString();
            const log = `\n[${timestamp}] ${req.method} ${req.url}\n`;
            logFile.write(log);
            logFile.write(`Headers: ${JSON.stringify(req.headers, null, 2)}\n`);
            if (body) {
              logFile.write(`Body: ${body}\n`);
            }
            logFile.write(`--------------------------\n`);
          }
          
          // Create a simple HTTP proxy
          const proxy = http.createServer((req, res) => {
            console.log(`Proxying: ${req.method} ${req.url}`);
            
            let body = '';
            req.on('data', (chunk) => {
              body += chunk;
            });
            
            req.on('end', () => {
              logRequest(req, res, body);
              
              // Determine if this is HTTP or HTTPS
              const options = new URL(req.url);
              const proxyReq = (options.protocol === 'https:' ? https : http).request(
                options,
                (proxyRes) => {
                  res.writeHead(proxyRes.statusCode, proxyRes.headers);
                  proxyRes.pipe(res, { end: true });
                }
              );
              
              proxyReq.on('error', (error) => {
                console.error(`Proxy request error: ${error.message}`);
                res.writeHead(500);
                res.end(`Proxy error: ${error.message}`);
              });
              
              if (body) {
                proxyReq.write(body);
              }
              
              proxyReq.end();
            });
          });
          
          // Start tcpdump
          const tcpdump = spawn('sudo', [
            'tcpdump', 
            '-i', 'any', 
            '-n',
            'port 80 or port 443 or port 9090 or port 9091', 
            '-w', 'cache_traffic.pcap'
          ]);
          
          tcpdump.stdout.on('data', (data) => {
            console.log(`tcpdump stdout: ${data}`);
          });
          
          tcpdump.stderr.on('data', (data) => {
            console.error(`tcpdump stderr: ${data}`);
          });
          
          // Start the proxy server
          proxy.listen(8080, () => {
            console.log('Proxy server listening on port 8080');
          });
          
          // Handle cleanup
          process.on('SIGINT', () => {
            console.log('Stopping proxy server and tcpdump');
            proxy.close();
            tcpdump.kill('SIGINT');
            process.exit();
          });
          EOF
          
          # Start the HTTP inspection script
          node http-logger.js &
          echo $! > http-logger.pid
          sleep 5
          
          # Check if the script is running
          if ps -p $(cat http-logger.pid) > /dev/null; then
            echo "HTTP logger script is running with PID $(cat http-logger.pid)"
          else
            echo "HTTP logger script failed to start"
            exit 1
          fi

      - name: Save cache without proxy (baseline)
        uses: actions/cache/save@v4
        with:
          path: test.txt
          key: test-direct-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup proxy environment
        run: |
          echo "http_proxy=http://127.0.0.1:8080" >> $GITHUB_ENV
          echo "https_proxy=http://127.0.0.1:8080" >> $GITHUB_ENV
          echo "HTTP_PROXY=http://127.0.0.1:8080" >> $GITHUB_ENV
          echo "HTTPS_PROXY=http://127.0.0.1:8080" >> $GITHUB_ENV

      - name: Save cache with proxy logging
        id: cache-with-proxy
        continue-on-error: true
        uses: actions/cache/save@v4
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'  # Only for test environment
        with:
          path: test.txt
          key: test-proxy-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Stop HTTP logger and extract data
        run: |
          if [ -f http-logger.pid ]; then
            echo "Stopping HTTP logger process"
            kill $(cat http-logger.pid) || true
            sleep 2
          else
            echo "No HTTP logger process ID file found"
          fi
          
          # Stop tcpdump if running
          sudo pkill tcpdump || true
          
          # Check if logs were captured
          if [ -f http_requests.log ]; then
            echo "HTTP request log file exists"
            ls -la http_requests.log
          else
            echo "No HTTP request log file found"
          fi
          
          # Check if pcap file was captured
          if [ -f cache_traffic.pcap ]; then
            echo "tcpdump capture file exists"
            ls -la cache_traffic.pcap
            
            # Extract readable data from pcap
            sudo tcpdump -r cache_traffic.pcap -A | grep -A 10 -B 10 "Authorization:" > tcpdump_auth_headers.txt || true
            sudo tcpdump -r cache_traffic.pcap -A | grep -A 10 -B 10 "Host:" > tcpdump_host_headers.txt || true
          else
            echo "No tcpdump capture file found"
          fi

      - name: Display HTTP request logs
        run: |
          echo "=== HTTP Request Logs ==="
          if [ -f http_requests.log ]; then
            cat http_requests.log
          else
            echo "No HTTP request log file found"
          fi
          
      - name: Display tcpdump authentication headers
        run: |
          echo "=== tcpdump Authentication Headers ==="
          if [ -f tcpdump_auth_headers.txt ]; then
            cat tcpdump_auth_headers.txt
          else
            echo "No tcpdump authentication headers file found"
          fi
          
      - name: Display tcpdump host headers
        run: |
          echo "=== tcpdump Host Headers ==="
          if [ -f tcpdump_host_headers.txt ]; then
            cat tcpdump_host_headers.txt
          else
            echo "No tcpdump host headers file found"
          fi
          
      # Try direct network inspection as a last resort
      - name: Direct network inspection
        run: |
          echo "Performing direct network inspection during cache operation..."
          
          # Start tcpdump in background
          sudo tcpdump -i any -n port 80 or port 443 or port 9090 or port 9091 -w direct_cache_traffic.pcap &
          TCPDUMP_PID=$!
          sleep 2
          
          # Run curl to the cache URL to see what headers are sent
          if [ -n "$ACTIONS_CACHE_URL" ]; then
            echo "Testing connection to ACTIONS_CACHE_URL: $ACTIONS_CACHE_URL"
            curl -v $ACTIONS_CACHE_URL || echo "Failed to connect to ACTIONS_CACHE_URL"
          fi
          
          if [ -n "$ACTIONS_RESULTS_URL" ]; then
            echo "Testing connection to ACTIONS_RESULTS_URL: $ACTIONS_RESULTS_URL"
            curl -v $ACTIONS_RESULTS_URL || echo "Failed to connect to ACTIONS_RESULTS_URL"
          fi
          
          sleep 5
          
          # Stop tcpdump
          sudo kill $TCPDUMP_PID || true
          
          # Process the pcap file
          if [ -f direct_cache_traffic.pcap ]; then
            echo "Direct tcpdump capture file exists"
            sudo tcpdump -r direct_cache_traffic.pcap -A > direct_network_inspection.txt
            
            echo "=== Direct Network Inspection Results ==="
            cat direct_network_inspection.txt
          else
            echo "No direct tcpdump capture file found"
          fi

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        env:
          ACTIONS_RUNTIME_TOKEN: ${{env.ACTIONS_RUNTIME_TOKEN}}
        with:
          detached: true
