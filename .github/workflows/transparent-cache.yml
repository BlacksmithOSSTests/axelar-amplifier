name: Cache Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  test-cache:
    name: test-transparent-cache
    runs-on: blacksmith-staging
    env:
      ACTIONS_STEP_DEBUG: true
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_RUNTIME_TOKEN_VERBOSE: true
      ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: true
      RUNNER_DEBUG: 1
      ACTIONS_CACHE_DEBUG: true

    steps:
      - name: Install mitmproxy
        run: |
          sudo apt-get update
          sudo apt-get install -y mitmproxy ca-certificates
          which mitmdump
          mitmdump --version

      - name: Create script file
        run: |
          mkdir -p ~/.mitmproxy
          cat > ~/.mitmproxy/modify_headers.py << 'EOF'
          def response(flow):
              flow.response.headers["mitmproxy-note"] = "captured-by-workflow"
          EOF
          cat ~/.mitmproxy/modify_headers.py

      - name: Set up mitmproxy certificate
        run: |
          # Start mitmproxy with explicit details and check if it's running
          mitmdump --set confdir=~/.mitmproxy -s ~/.mitmproxy/modify_headers.py --listen-host 127.0.0.1 --listen-port 8080 --no-http2 &
          
          # Store the PID and wait for proxy to initialize
          echo $! > mitmproxy.pid
          sleep 10
          
          # Verify mitmproxy is running
          if ps -p $(cat mitmproxy.pid) > /dev/null; then
            echo "Mitmproxy is running with PID $(cat mitmproxy.pid)"
          else
            echo "Mitmproxy failed to start"
            exit 1
          fi
          
          # Check if port 8080 is listening
          netstat -tulpn | grep 8080 || echo "Port 8080 is not listening"
          
          # Check if the certificate was generated
          ls -la ~/.mitmproxy/
          
          if [ -f ~/.mitmproxy/mitmproxy-ca-cert.pem ]; then
            echo "Certificate file exists"
            # Trust the mitmproxy certificate
            sudo cp ~/.mitmproxy/mitmproxy-ca-cert.pem /usr/local/share/ca-certificates/mitmproxy.crt
            sudo update-ca-certificates
          else
            echo "Certificate file does not exist, attempting to generate it"
            # Attempt to generate certificate explicitly
            mitmdump --set confdir=~/.mitmproxy --generate-ca-cert
            ls -la ~/.mitmproxy/
            
            if [ -f ~/.mitmproxy/mitmproxy-ca-cert.pem ]; then
              sudo cp ~/.mitmproxy/mitmproxy-ca-cert.pem /usr/local/share/ca-certificates/mitmproxy.crt
              sudo update-ca-certificates
            else
              echo "Failed to generate certificate"
              exit 1
            fi
          fi
      
      # Create test file and perform cache operations WITHOUT proxy initially
      - name: Create test file
        run: |
          echo "Hello from cache test" > test.txt
          cat test.txt

      - name: Debug cache environment variables
        run: |
          echo "Checking cache environment variables before save operation..."
          echo "BLACKSMITH_CACHE_URL: $BLACKSMITH_CACHE_URL"
          echo "BLACKSMITH_CACHE_TOKEN: ${BLACKSMITH_CACHE_TOKEN:0:5}..."
          echo "ACTIONS_RUNTIME_TOKEN: ${ACTIONS_RUNTIME_TOKEN:0:5}..."
          echo "Using ACTIONS_CACHE_URL: $ACTIONS_CACHE_URL"
          echo "Using ACTIONS_RESULTS_URL: $ACTIONS_RESULTS_URL"

      # First try to save cache without proxy to establish baseline
      - name: Save cache (no proxy)
        uses: actions/cache/save@v4
        with:
          path: test.txt
          key: test-transparent-cache-no-proxy-${{ github.run_id }}-${{ github.run_attempt }}

      # Test if curl works with the proxy
      - name: Test proxy with curl
        run: |
          echo "Testing proxy connectivity..."
          curl -v --proxy http://127.0.0.1:8080 https://httpbin.org/get || echo "Proxy connection failed"
          
          # If proxy test fails, try direct connection
          if [ $? -ne 0 ]; then
            echo "Testing direct connection..."
            curl -v https://httpbin.org/get
          fi

      # Now try with proxy (only if proxy test succeeded)
      - name: Configure system to use proxy
        run: |
          # Set environment variables for the proxy
          echo "http_proxy=http://127.0.0.1:8080" >> $GITHUB_ENV
          echo "https_proxy=http://127.0.0.1:8080" >> $GITHUB_ENV
          echo "HTTP_PROXY=http://127.0.0.1:8080" >> $GITHUB_ENV
          echo "HTTPS_PROXY=http://127.0.0.1:8080" >> $GITHUB_ENV
          echo "NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/mitmproxy.crt" >> $GITHUB_ENV
        
      - name: Save cache with proxy
        id: cache-with-proxy
        uses: actions/cache/save@v4
        continue-on-error: true
        env:
          http_proxy: http://127.0.0.1:8080
          https_proxy: http://127.0.0.1:8080
          NODE_TLS_REJECT_UNAUTHORIZED: '0'  # Only for this test environment
        with:
          path: test.txt
          key: test-transparent-cache-with-proxy-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Print cache save details
        run: |
          echo "Cache save operation completed with status: ${{ steps.cache-with-proxy.outcome }}"
          echo "Cache key: test-transparent-cache-with-proxy-${{ github.run_id }}"
          echo "Cache URL: $ACTIONS_RESULTS_URL"
          
      - name: Stop mitmproxy and export data
        run: |
          if [ -f mitmproxy.pid ]; then
            # List all files in the mitmproxy directory
            echo "Mitmproxy directory contents:"
            ls -la ~/.mitmproxy/
            
            # Export flow data before killing if it exists
            if [ -f ~/.mitmproxy/flows ]; then
              echo "Copying flows file to cache_flows.flows"
              cp ~/.mitmproxy/flows cache_flows.flows
              
              # Kill the proxy process
              echo "Killing mitmproxy process"
              sudo kill $(cat mitmproxy.pid) || true
              
              # Convert flows to a readable format
              echo "Converting flows to readable format"
              mitmdump -n -r cache_flows.flows --set flow_detail=3 -d > mitmproxy_dump.txt
              
              # Extract just the URLs and request details
              echo "Extracting URLs and request details"
              grep -E "GET|POST|PUT|DELETE" mitmproxy_dump.txt > http_requests.txt || echo "No requests found"
              
              # Create summary of hosts contacted
              echo "Creating host summary"
              grep -E "Host:" mitmproxy_dump.txt | sort | uniq -c | sort -nr > hosts_summary.txt || echo "No hosts found"
              
              # Display the captured data
              echo "=== HTTP Requests ==="
              cat http_requests.txt || echo "No HTTP requests file"
              
              echo "=== Hosts Summary ==="
              cat hosts_summary.txt || echo "No hosts summary file"
            else
              echo "No flows file found at ~/.mitmproxy/flows"
              # Kill the proxy process anyway
              echo "Killing mitmproxy process"
              sudo kill $(cat mitmproxy.pid) || true
            fi
          else
            echo "No mitmproxy process ID file found"
          fi

      # Use tmate directly without proxy
      - name: Remove proxy environment variables
        run: |
          echo "http_proxy=" >> $GITHUB_ENV
          echo "https_proxy=" >> $GITHUB_ENV
          echo "HTTP_PROXY=" >> $GITHUB_ENV
          echo "HTTPS_PROXY=" >> $GITHUB_ENV
          echo "NODE_EXTRA_CA_CERTS=" >> $GITHUB_ENV
          echo "Environment variables unset for next steps"
      
      - name: Setup tmate session without proxy
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
